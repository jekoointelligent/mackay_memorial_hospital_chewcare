# render.yaml — Render 部署設定（選用）
# 不要把 Supabase / R2 secret 寫進此檔案，secrets 請在 Render Dashboard 手動設定。
# 詳細部署步驟見 docs/DEPLOYMENT.md

services:
  - type: web
    name: chewcare-platform
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # 以下變數請在 Render Dashboard → Environment 手動填入，不要寫在這裡：
      # NEXT_PUBLIC_SUPABASE_URL
      # NEXT_PUBLIC_SUPABASE_ANON_KEY
      # SUPABASE_SERVICE_ROLE_KEY
      # SESSION_SECRET
      # ADMIN_EMAIL
      # ADMIN_PASSWORD
      # R2_ACCOUNT_ID
      # R2_ACCESS_KEY_ID
      # R2_SECRET_ACCESS_KEY
      # R2_BUCKET_NAME
      # R2_PUBLIC_BASE_URL
